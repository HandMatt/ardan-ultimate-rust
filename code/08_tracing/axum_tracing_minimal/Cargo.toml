[package]
name = "axum_tracing_minimal"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7.4"
reqwest = { version = "0.11.24", features = ["json"] }
tokio = { version = "1.36.0", features = ["full"] }
tower-http = { version = "0.5.1", features = ["fs", "compression-full"] }
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
